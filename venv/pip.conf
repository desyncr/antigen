# Tracked on purpose (venv/ is otherwise gitignored): this repo's actual
# dependency-install path is still plain `pip install cram==0.6.*` (see
# Makefile's install-deps and .github/workflows/ci.yml) — nothing about
# that changes. This file only makes that same pip install able to
# resolve from the single wheel vendored in venv/offline-wheels/ when
# there's no network to reach PyPI, which some sandboxed CI/check
# environments require. `python -m venv venv` does not clear pre-existing
# files in an already-existing directory, so this survives that step.
[global]
no-index = true
find-links = venv/offline-wheels
